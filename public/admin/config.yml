backend:
  name: git-gateway
  branch: main

media_folder: "public/upload/images"
public_folder: "/upload/images"

collections:
  - name: "content"
    label: "Site Content"
    files:

      - file: "src/data/home.json"
        label: "Home Page"
        name: "home"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Background GIF/Image", name: "backgroundGif", widget: "image" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Primary Button Text", name: "primaryButtonText", widget: "string" }
              - { label: "Primary Button Link", name: "primaryButtonLink", widget: "string" }
              - { label: "Secondary Button Text", name: "secondaryButtonText", widget: "string" }
              - { label: "Secondary Button Link", name: "secondaryButtonLink", widget: "string" }
          - { label: "Focus Section Title", name: "focusTitle", widget: "string" }
          - label: "Focus Areas"
            name: "focusAreas"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Icon (Font Awesome class, e.g. fas fa-lightbulb)", name: "icon", widget: "string" }
              - { label: "Animation (pulse, rotate, or bounce)", name: "animation", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
          - label: "About Preview Section"
            name: "aboutPreview"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Mission Title", name: "missionTitle", widget: "string" }
              - { label: "Mission Text", name: "missionText", widget: "text" }
              - { label: "Vision Title", name: "visionTitle", widget: "string" }
              - { label: "Vision Text", name: "visionText", widget: "text" }
              - { label: "Diversity Title", name: "diversityTitle", widget: "string" }
              - { label: "Diversity Intro", name: "diversityIntro", widget: "text" }
              - label: "Diversity Points"
                name: "diversityPoints"
                widget: "list"
                field: { label: "Point", name: "point", widget: "string" }
              - { label: "Button Text", name: "ctaText", widget: "string" }
              - { label: "Button Link", name: "ctaLink", widget: "string" }
          - label: "Podcast Preview Section"
            name: "podcastPreview"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "'View More' Text", name: "viewMoreText", widget: "string" }
              - { label: "'View More' Link", name: "viewMoreLink", widget: "string" }
          - label: "Gallery Preview Section"
            name: "galleryPreview"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "'View More' Text", name: "viewMoreText", widget: "string" }
              - { label: "'View More' Link", name: "viewMoreLink", widget: "string" }
          - label: "Testimonials Section"
            name: "testimonials"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - label: "Testimonials"
                name: "items"
                widget: "list"
                summary: "{{author}}"
                fields:
                  - { label: "Quote", name: "quote", widget: "text" }
                  - { label: "Author Name", name: "author", widget: "string" }
              - { label: "Button Text", name: "ctaText", widget: "string" }
              - { label: "Button Link", name: "ctaLink", widget: "string" }

      - file: "src/data/about.json"
        label: "About Page"
        name: "about"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
          - label: "Mission"
            name: "mission"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Vision"
            name: "vision"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Impact"
            name: "impact"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Items"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
          - label: "Achievements"
            name: "achievements"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Items"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
          - label: "Diversity & Team Strength"
            name: "diversity"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Items"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
          - label: "Team Highlights"
            name: "highlights"
            widget: "object"
            fields:
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Items"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
          - { label: "Partners Section Title", name: "partnersTitle", widget: "string" }
          - label: "Partners"
            name: "partners"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Position (optional)", name: "position", widget: "string", required: false }
              - { label: "Bio", name: "bio", widget: "text" }
          - { label: "Tech Team Section Title", name: "techTeamTitle", widget: "string" }
          - label: "Tech Team"
            name: "techTeam"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Link Text", name: "linkText", widget: "string" }
              - { label: "Link URL", name: "linkUrl", widget: "string" }

      - file: "src/data/contact.json"
        label: "Contact Page"
        name: "contact"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
          - { label: "Form Section Title", name: "formTitle", widget: "string" }
          - { label: "Success Message Title", name: "successTitle", widget: "string" }
          - { label: "Success Message Text", name: "successText", widget: "text" }
          - { label: "Contact Info Title", name: "infoTitle", widget: "string" }
          - { label: "Address", name: "address", widget: "text" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }

      - file: "src/data/projects.json"
        label: "Projects"
        name: "projects"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - label: "Tags (location, date, etc.)"
                name: "tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }
              - { label: "Link (internal path like /visegrad, or a full URL)", name: "link", widget: "string" }
              - { label: "Featured (shows as the highlighted project at the top of the page)", name: "featured", widget: "boolean", default: false }

      - file: "src/data/ambassadors.json"
        label: "Ambassadors"
        name: "ambassadors"
        fields:
          - label: "Ambassadors"
            name: "ambassadors"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Instagram Link", name: "instagram", widget: "string", required: false }

      - file: "src/data/podcasts.json"
        label: "Podcasts"
        name: "podcasts"
        fields:
          - label: "Podcasts"
            name: "podcasts"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Thumbnail", name: "thumbnail", widget: "image" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "YouTube Link", name: "youtubeLink", widget: "string" }

      - file: "src/data/gallery.json"
        label: "Gallery"
        name: "gallery"
        fields:
          - label: "Gallery Images"
            name: "gallery"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Title (optional caption)", name: "title", widget: "string", required: false }
              - { label: "Video Link (optional)", name: "videoLink", widget: "string", required: false }
              - { label: "Floating animation", name: "floating", widget: "boolean", default: false }

      - file: "src/data/visegrad.json"
        label: "Visegrad Event Page"
        name: "visegrad"
        fields:
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "'About the Event' Title", name: "aboutTitle", widget: "string" }
          - { label: "'About the Event' Text", name: "aboutText", widget: "text" }
          - { label: "'What We Did' Title", name: "whatWeDidTitle", widget: "string" }
          - { label: "'What We Did' Text (paragraph 1)", name: "whatWeDidText1", widget: "text" }
          - { label: "'What We Did' Text (paragraph 2)", name: "whatWeDidText2", widget: "text" }
          - { label: "'Location & Date' Title", name: "locationTitle", widget: "string" }
          - { label: "'Location & Date' Text", name: "locationText", widget: "string" }
          - { label: "'Our Message' Title", name: "messageTitle", widget: "string" }
          - { label: "Message Text", name: "messageText1", widget: "text" }
          - { label: "Hashtags", name: "messageText2", widget: "string" }
          - { label: "'Get Involved' Title", name: "getInvolvedTitle", widget: "string" }
          - { label: "'Get Involved' Text (before the link)", name: "getInvolvedTextBeforeLink", widget: "text" }
          - { label: "'Get Involved' Link Text", name: "getInvolvedLinkText", widget: "string" }
          - { label: "Gallery Section Title", name: "galleryTitle", widget: "string" }
          - { label: "Google Drive Link (more photos)", name: "driveLink", widget: "string" }
          - { label: "Google Drive Button Text", name: "driveButtonText", widget: "string" }
          - label: "Featured Images (right-side grid)"
            name: "featuredImages"
            widget: "list"
            field: { label: "Image", name: "image", widget: "image" }
          - label: "Event Gallery Images"
            name: "galleryImages"
            widget: "list"
            field: { label: "Image", name: "image", widget: "image" }
          - label: "Bottom Images (max 2 shown)"
            name: "bottomImages"
            widget: "list"
            field: { label: "Image", name: "image", widget: "image" }

      - file: "src/data/site.json"
        label: "Site-wide (Navbar & Footer)"
        name: "site"
        fields:
          - { label: "Logo Text (typewriter effect in navbar)", name: "logoText", widget: "string" }
          - { label: "Logo Image", name: "logoImage", widget: "image" }
          - { label: "Footer Tagline", name: "footerTagline", widget: "string" }
          - { label: "Footer Organization Name", name: "footerOrgName", widget: "string" }
          - { label: "Footer 'Connect With Us' Title", name: "footerConnectTitle", widget: "string" }
          - label: "Social Links"
            name: "socialLinks"
            widget: "object"
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "Twitter", name: "twitter", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }
              - { label: "Spotify", name: "spotify", widget: "string", required: false }
