<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager — Creative Youth Academy</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /*
        Decap's Emotion CSS-in-JS keeps each styled component's source name
        as part of its runtime class (e.g. class="css-xxxxx-AppHeaderLogo"),
        confirmed by grepping the shipped decap-cms.js bundle for `label:`
        entries. [class*="Name"] below targets those directly, so this
        reaches the actual app chrome, not just generic form elements.
      */
      :root {
        --cya-primary: #0d4986;
        --cya-secondary: #0b67df;
        --cya-accent: #bcd5cd;
        --cya-accent-tint: #eaf2f0;
      }

      html, body {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }

      body {
        background-color: #f4f8f7 !important;
      }

      a {
        color: var(--cya-secondary);
      }

      a:hover {
        color: var(--cya-primary);
      }

      input:focus,
      textarea:focus,
      select:focus,
      [data-slate-editor="true"]:focus-within {
        outline-color: var(--cya-secondary) !important;
        border-color: var(--cya-secondary) !important;
        box-shadow: 0 0 0 1px var(--cya-secondary) !important;
      }

      ::selection {
        background-color: var(--cya-accent);
        color: var(--cya-primary);
      }

      @media (max-width: 799px) {
        [data-slate-editor="true"], input, textarea {
          font-size: 16px !important;
        }
      }

      /* Top app bar: Contents / Media nav */
      [class*="AppHeaderContent"] {
        background-color: var(--cya-primary) !important;
      }
      [class*="AppHeaderNavLink"] {
        color: rgba(255, 255, 255, 0.75) !important;
      }
      [class*="AppHeaderNavLink"][class*="active"],
      [class*="AppHeaderNavLink"]:hover {
        color: #ffffff !important;
      }
      [class*="AppHeaderQuickNewButton"],
      [class*="AppHeaderButton"] {
        background-color: var(--cya-secondary) !important;
        color: #ffffff !important;
      }

      /* Collections sidebar */
      [class*="SidebarContainer"] {
        background-color: #ffffff !important;
        border-right: 1px solid var(--cya-accent) !important;
      }
      [class*="SidebarHeading"] {
        color: var(--cya-primary) !important;
      }
      [class*="SidebarNavLink"][aria-current="page"],
      [class*="SidebarNavLink"].active {
        background-color: var(--cya-accent-tint) !important;
        color: var(--cya-primary) !important;
        border-left: 3px solid var(--cya-secondary) !important;
      }

      /* Collection entry cards (Home Page / About Page / ... grid) */
      [class*="CardGrid"] [class*="Card"] {
        border-radius: 10px !important;
        border: 1px solid var(--cya-accent) !important;
        transition: box-shadow 0.15s ease, transform 0.15s ease;
      }
      [class*="CardGrid"] [class*="Card"]:hover {
        box-shadow: 0 6px 16px rgba(13, 73, 134, 0.12) !important;
        transform: translateY(-2px);
      }
      [class*="CardHeading"] {
        color: var(--cya-primary) !important;
      }

      /* Entry editor top toolbar (back link / Published / Check for Preview) */
      [class*="ToolbarContainer"] {
        background-color: #ffffff !important;
        border-bottom: 2px solid var(--cya-accent) !important;
      }
      [class*="PublishedButton"],
      [class*="PublishButton"] {
        background-color: var(--cya-secondary) !important;
        color: #ffffff !important;
      }

      /* List/Object widget rows (the grey accordion bars, e.g. each Project) */
      [class*="ObjectWidgetTopBar"],
      [class*="ListItemTopBar"],
      [class*="StyledListItemTopBar"] {
        background-color: var(--cya-accent-tint) !important;
        border-radius: 6px !important;
      }
      [class*="NestedObjectLabel"] {
        color: var(--cya-primary) !important;
      }
      [class*="AddButton"] {
        background-color: var(--cya-secondary) !important;
        color: #ffffff !important;
        border-radius: 6px !important;
      }
    </style>
  </head>
  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
