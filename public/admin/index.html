<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager — Creative Youth Academy</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /*
        Decap CMS renders its own React app chrome with generated, unstable
        class names, so we can only reliably brand the parts of the DOM that
        are plain semantic elements: fonts, links, form controls, focus
        rings and the page background. The sidebar/top-bar internals stay
        Decap's default styling.
      */
      :root {
        --cya-primary: #0d4986;
        --cya-secondary: #0b67df;
        --cya-accent: #bcd5cd;
      }

      html, body {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }

      body {
        background-color: #f4f8f7 !important;
      }

      a {
        color: var(--cya-secondary);
      }

      a:hover {
        color: var(--cya-primary);
      }

      input:focus,
      textarea:focus,
      select:focus,
      [data-slate-editor="true"]:focus-within {
        outline-color: var(--cya-secondary) !important;
        border-color: var(--cya-secondary) !important;
        box-shadow: 0 0 0 1px var(--cya-secondary) !important;
      }

      ::selection {
        background-color: var(--cya-accent);
        color: var(--cya-primary);
      }

      @media (max-width: 799px) {
        [data-slate-editor="true"], input, textarea {
          font-size: 16px !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
